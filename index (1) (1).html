<style>
*{box-sizing:border-box}
:root{--bg:#14181F;--card:#232A35;--ink:#F2EFE8;--amb:#F5A623;--red:#FF6B5E;--blue:#4DA3FF;--grn:#3CFF8A}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,"Noto Sans TC","Noto Sans Thai","Noto Sans Devanagari","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
section{padding:clamp(48px,8vw,100px) clamp(18px,5vw,60px);max-width:1100px;margin:0 auto;opacity:0;transform:translateY(36px)}
section.in{opacity:1;transform:none}
/* pixel / Minecraft look */
section{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;image-rendering:pixelated}
@keyframes pxin{0%{opacity:0;transform:translateY(24px)}50%{opacity:1}100%{opacity:1;transform:none}}
html:not(.pxwait) .hero>:not(h1){animation:pxin 1s cubic-bezier(.22,1,.36,1) both}
html:not(.pxwait) .hero>:nth-child(3){animation-delay:1.1s}
svg.off .flow{animation-play-state:paused}
.hero h1{text-shadow:.055em .055em 0 rgba(0,0,0,.5)}
.hero h1 .amb{text-shadow:.055em .055em 0 #7a3a05}
.card b{text-shadow:3px 3px 0 rgba(122,58,5,.6)}
@media(prefers-reduced-motion:reduce){html:not(.pxwait) .hero>*{animation:none}section{transition:none}}
h1{font-size:clamp(42px,9vw,104px);font-weight:800;line-height:1.02;margin:0 0 18px}
h2{font-size:clamp(28px,5vw,52px);font-weight:800;margin:0 0 10px}
h3{font-size:20px;margin:0 0 8px}
p{font-size:clamp(16px,2vw,20px);line-height:1.5;margin:0 0 14px;color:#cfcabf}
.amb{color:var(--amb)}
.hero{min-height:92vh;min-height:92svh;display:flex;flex-direction:column;justify-content:center}
.hero .tag{color:var(--amb);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border-radius:20px;padding:22px}
.card b{display:block;color:var(--amb);font-size:34px;margin-bottom:6px}
.panel{background:var(--card);border-radius:24px;padding:clamp(14px,3vw,28px);margin-top:20px}
svg{direction:ltr;width:100%;height:auto;display:block;touch-action:manipulation}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:600 16px Inter,sans-serif;border:0;border-radius:999px;padding:12px 20px;background:#323b4b;color:var(--ink);cursor:pointer}
button.on{background:var(--amb);color:#14181F}
button:active{transform:scale(.97)}
input[type=range]{flex:1;min-width:140px;accent-color:var(--amb);height:28px}
input[type=number]{width:100px;font:600 18px Inter,sans-serif;background:#14181F;color:var(--ink);border:2px solid #3a4352;border-radius:12px;padding:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#1b212b;border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:clamp(20px,4vw,32px);color:var(--amb)}
.stat span{font-size:13px;color:#9aa4b5}
.say{background:#1b212b;border-inline-start:6px solid var(--amb);border-radius:12px;padding:14px 16px;font-size:clamp(15px,2vw,19px);line-height:1.45;min-height:3.6em}
.say.bad{border-color:var(--red)}.say.good{border-color:var(--grn)}
.flow{fill:none;stroke:#FFD23F;stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 16;animation:fl linear infinite}
@keyframes fl{to{stroke-dashoffset:-16.1}}
.wire{fill:none;stroke:#566175;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg text{font-family:Inter,sans-serif}
.bars div{height:30px;border-radius:8px;margin:8px 0;display:flex;align-items:center;padding-inline-start:12px;font-weight:600;color:#14181F;transition:width .3s;white-space:nowrap}
.steps{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.steps button{width:100%;text-align:start;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-weight:400;font-size:clamp(15px,2vw,19px)}
.steps button i{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid #566175;display:grid;place-items:center;font-style:normal;font-weight:800}
.steps button.done{background:#1f3a2c}.steps button.done i{background:var(--grn);border-color:var(--grn);color:#14181F}
.prog{height:12px;background:#1b212b;border-radius:99px;overflow:hidden}.prog div{height:100%;width:0;background:var(--grn);transition:width .4s}
#lg{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline-end:10px;z-index:10;background:#F5A623;color:#14181F;border:0;border-radius:999px;padding:10px 14px;font:600 15px Inter,sans-serif}
.tm{text-align:center}.av{width:72px;height:72px;border-radius:50%;background:#323b4b;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--amb)}.lead .av{background:var(--amb);color:#14181F}.tm small{display:block;color:#9aa4b5;margin-bottom:4px;font-size:14px}.nm{font-size:22px;font-weight:800}
@media(max-width:600px){.stats{gap:6px}.stat{padding:8px 4px}}
/* letters fall from above, slightly tilted, and land upright */
.w{display:inline-block;white-space:nowrap}
.lt{display:inline-block;opacity:0}
@keyframes drop{
  0%{opacity:0;transform:translateY(calc(var(--h) * -1)) rotate(var(--r));animation-timing-function:cubic-bezier(.55,0,.9,.5)}
  12%{opacity:1}
  68%{opacity:1;transform:translateY(0) rotate(0deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  84%{opacity:1;transform:translateY(-.1em) rotate(0deg)}
  100%{opacity:1;transform:none}
}
section.in .lt{animation:drop .8s both;animation-delay:calc(var(--i) * var(--st,42ms) + 150ms)}
</style>

<script>
/* pixel particles: yellow-orange squares pop up and fall when you press interactive controls */
(function(){
var c=document.getElementById("fx");if(!c)return;
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){c.remove();return}
var x=c.getContext("2d"),P=["#FFF1A8","#FFD23F","#FFD23F","#F5A623","#F5A623","#FF8C1A","#E8590C"],parts=[],run=false,last=0,lastSlide=0;
function size(){c.width=innerWidth;c.height=innerHeight}
size();addEventListener("resize",size);
function spawn(px,py,n,spread){
  for(var i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*(spread||6),vy:-Math.random()*4-1.5,s:[4,6,8][Math.random()*3|0],c:P[Math.random()*P.length|0],l:1});
  if(!run){run=true;c.style.display="block";last=performance.now();requestAnimationFrame(loop)}
}
function loop(now){
  var dt=Math.min(40,now-last)/16.7;last=now;
  x.clearRect(0,0,c.width,c.height);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.28*dt;p.l-=.012*dt;
    if(p.l<=0||p.y>c.height+20){parts.splice(i,1);continue}
    if(p.l<.3&&Math.floor(p.l*30)%2)continue;
    x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.s,p.s);
    x.fillStyle="rgba(0,0,0,.25)";x.fillRect(p.x|0,(p.y|0)+p.s-2,p.s,2);
  }
  if(parts.length)requestAnimationFrame(loop);else{run=false;x.clearRect(0,0,c.width,c.height);c.style.display="none"}
}
document.addEventListener("pointerdown",function(e){
  var t=e.target.closest&&e.target.closest("button,g[data-i]");
  if(t)spawn(e.clientX,e.clientY,16,7);
},true);
document.addEventListener("input",function(e){
  var t=e.target;if(!t||t.type!=="range")return;
  var n=performance.now();if(n-lastSlide<60)return;lastSlide=n;
  var r=t.getBoundingClientRect(),f=(t.value-t.min)/(t.max-t.min);
  spawn(r.left+12+f*(r.width-24),r.top+r.height/2,4,3);
});
})();
</script>

zh:{tag:"電子學實作",h1a:"並聯",h1b:"電路",hero:"一個可以拆、可以翻、可以測量的電路。往下捲動，動手試試。",idea:"三張卡片看懂概念",c1t:"多條路徑",c1p:"每個元件各自在一條支路上直接連到電池。",c2t:"電壓相同",c2p:"每條支路都得到電池的完整電壓。",c3t:"電流相加",c3p:"電池供應所有支路電流的總和。",lab:"先組裝，再弄壞",labp:"切換並聯或串聯，拖曳電壓，點燈泡即可移除。燈泡額定 6 V。",par:"並聯",ser:"串聯",vb:"燈泡電壓",cur:"電池輸出電流",rt:"總電阻",open:"斷路",rem:"已移除",m_none:"所有支路都斷開：沒有路徑，沒有電流。",m_out:"一顆燈泡熄滅了，其他燈泡完全不受影響。每條支路都有自己的路徑，這就是家中插座採用並聯的原因。",m_all:"每顆燈泡都得到完整的 {0} V，所以亮度相同。點燈泡可移除它。",m_sbreak:"少了一顆燈泡，唯一的路徑斷了，全部熄滅。",m_sdim:"{0} V 由燈泡分攤（{1} V），所以都很暗。試試 12 V。",pol:"為什麼正負極很重要",polp:"翻轉電池，然後把電阻拿掉。",flip:"翻轉電池",resOn:"電阻：開",resOff:"電阻：關",reset:"重設",resistor:"電阻",anode:"陽極 (+)",cathode:"陰極 (−)",p_ok:"正常：電流從長腳 (+) 進入，從短腳 (−) 流出，電阻讓電流保持安全。",p_burn:"燒壞了：沒有任何東西限制電流。LED 一定要搭配電阻。",p_rev:"接反了：LED 擋住電流，不會亮。電壓較高時還可能損壞。",calc:"電阻計算器",calcsay:"並聯 ({0} Ω) 比兩個電阻都小：路徑越多，電阻越小。",build:"組裝清單",buildp:"完成每一步就點一下。",s1:"準備電源和兩條導線：紅色和黑色",s2:"做出正負兩條匯流排",s3:"把每個元件接在兩條匯流排之間：正接正，負接負",s4:"每顆 LED 各自串聯一個電阻",s5:"可選：在每條支路加一個開關",s6:"確認正極沒有碰到負極，再通電",done:"完成，可以通電了。",team:"我們的團隊",leader:"組長",members:"組員"},
tr:{tag:"Elektronik, uygulamalı",h1a:"Paralel",h1b:"devre",hero:"Bozabileceğin, ters çevirebileceğin ve ölçebileceğin bir devre. Aşağı kaydır ve dokunmaya başla.",idea:"Fikir 3 kartta",c1t:"Çok yol",c1p:"Her eleman kendi kolunda doğrudan pile bağlıdır.",c2t:"Aynı gerilim",c2p:"Her kol pilin tüm gerilimini alır.",c3t:"Akımlar toplanır",c3p:"Pil, tüm kolların akımlarının toplamını sağlar.",lab:"Kur, sonra boz",labp:"Paralel ve seri arasında geçiş yap, gerilimi sürükle, kaldırmak için ampule dokun. Ampuller 6 V içindir.",par:"Paralel",ser:"Seri",vb:"ampul gerilimi",cur:"pilden çekilen akım",rt:"toplam direnç",open:"açık",rem:"çıkarıldı",m_none:"Tüm kollar açık: yol yok, akım yok.",m_out:"Bir ampul söndü ama diğerleri değişmedi. Her kolun kendi yolu var, evdeki prizlerin paralel bağlanmasının nedeni budur.",m_all:"Her ampul tam {0} V alır, bu yüzden hepsi aynı parlar. Kaldırmak için ampule dokun.",m_sbreak:"Bir ampul eksik, tek yol kesildi ve her şey karardı.",m_sdim:"{0} V ampuller arasında paylaşılır ({1} V), bu yüzden sönük yanarlar. 12 V dene.",pol:"Artı ve eksi neden önemli",polp:"Pili ters çevir, sonra direnci çıkar.",flip:"Pili ters çevir",resOn:"Direnç: AÇIK",resOff:"Direnç: KAPALI",reset:"Sıfırla",resistor:"direnç",anode:"anot (+)",cathode:"katot (−)",p_ok:"Çalışır: akım uzun bacaktan (+) girer, kısa bacaktan (−) çıkar, direnç de onu güvenli tutar.",p_burn:"Yandı: akımı hiçbir şey sınırlamıyor. LED ile her zaman direnç kullan.",p_rev:"Ters: LED akımı engeller ve yanmaz. Yüksek gerilimde zarar görebilir.",calc:"Direnç hesaplayıcı",calcsay:"Paralel ({0} Ω) iki dirençten de küçüktür: daha çok yol, daha az direnç.",build:"Kurulum listesi",buildp:"Her adımı yaptıkça dokun.",s1:"Bir güç kaynağı ve iki kablo al: kırmızı ve siyah",s2:"İki ray yap: artı ve eksi",s3:"Her elemanı raylar arasına bağla: artıyı artıya, eksiyi eksiye",s4:"Her LED'e seri olarak kendi direncini ver",s5:"İsteğe bağlı: her kola bir anahtar ekle",s6:"Artının eksiye hiçbir yerde değmediğini kontrol et, sonra çalıştır",done:"Tamam. Çalıştırabilirsin.",team:"Ekibimiz",leader:"Grup lideri",members:"Ekip üyeleri"},
th:{tag:"อิเล็กทรอนิกส์ แบบลงมือทำ",h1a:"วงจร",h1b:"ขนาน",hero:"วงจรที่คุณทำพัง พลิกกลับ และวัดค่าได้ เลื่อนลงแล้วลองจับดูเลย",idea:"แนวคิดใน 3 การ์ด",c1t:"หลายเส้นทาง",c1p:"อุปกรณ์แต่ละตัวต่อตรงกับแบตเตอรี่บนแขนงของตัวเอง",c2t:"แรงดันเท่ากัน",c2p:"ทุกแขนงได้รับแรงดันเต็มของแบตเตอรี่",c3t:"กระแสรวมกัน",c3p:"แบตเตอรี่จ่ายกระแสเท่ากับผลรวมของทุกแขนง",lab:"ต่อให้เสร็จ แล้วลองทำให้พัง",labp:"สลับระหว่างขนานกับอนุกรม ลากปรับแรงดัน แตะหลอดไฟเพื่อถอดออก หลอดไฟรับได้ 6 V",par:"ขนาน",ser:"อนุกรม",vb:"แรงดันที่หลอดไฟ",cur:"กระแสจากแบตเตอรี่",rt:"ความต้านทานรวม",open:"ขาดวงจร",rem:"ถอดออก",m_none:"ทุกแขนงเปิดอยู่ จึงไม่มีเส้นทางและไม่มีกระแส",m_out:"หลอดหนึ่งดับ แต่หลอดอื่นไม่เปลี่ยนเลย แต่ละแขนงมีเส้นทางของตัวเอง นี่คือเหตุผลที่ปลั๊กในบ้านต่อแบบขนาน",m_all:"ทุกหลอดได้รับ {0} V เต็ม จึงสว่างเท่ากัน แตะหลอดเพื่อถอดออก",m_sbreak:"ขาดหลอดไปหนึ่งดวง เส้นทางเดียวจึงขาด และทุกอย่างดับหมด",m_sdim:"แรงดัน {0} V ถูกแบ่งให้แต่ละหลอด ({1} V) จึงสว่างน้อย ลอง 12 V ดู",pol:"ทำไมขั้วบวกและลบจึงสำคัญ",polp:"พลิกแบตเตอรี่ แล้วลองถอดตัวต้านทานออก",flip:"พลิกแบตเตอรี่",resOn:"ตัวต้านทาน: เปิด",resOff:"ตัวต้านทาน: ปิด",reset:"รีเซ็ต",resistor:"ตัวต้านทาน",anode:"ขั้วแอโนด (+)",cathode:"ขั้วแคโทด (−)",p_ok:"ทำงานได้: กระแสเข้าขายาว (+) ออกขาสั้น (−) และตัวต้านทานช่วยให้ปลอดภัย",p_burn:"ไหม้แล้ว: ไม่มีอะไรจำกัดกระแส ใช้ LED ต้องมีตัวต้านทานเสมอ",p_rev:"กลับขั้ว: LED กันกระแสไว้และไม่สว่าง ถ้าแรงดันสูงอาจเสียหายได้",calc:"เครื่องคิดเลขความต้านทาน",calcsay:"แบบขนาน ({0} Ω) ต่ำกว่าตัวต้านทานทั้งสองตัว เพราะเส้นทางมากขึ้น ความต้านทานจึงน้อยลง",build:"เช็กลิสต์การต่อวงจร",buildp:"แตะแต่ละขั้นตอนเมื่อทำเสร็จ",s1:"เตรียมแหล่งจ่ายไฟและสายไฟสองเส้น: สีแดงและสีดำ",s2:"ทำรางสองราง: รางบวกและรางลบ",s3:"ต่ออุปกรณ์แต่ละตัวระหว่างราง: บวกเข้าบวก ลบเข้าลบ",s4:"ต่อตัวต้านทานอนุกรมให้ LED แต่ละดวง",s5:"ทางเลือก: เพิ่มสวิตช์ให้แต่ละแขนง",s6:"ตรวจว่าขั้วบวกไม่แตะขั้วลบเลย แล้วจึงเปิดไฟ",done:"เสร็จแล้ว เปิดไฟได้เลย",team:"ทีมของเรา",leader:"หัวหน้ากลุ่ม",members:"สมาชิกในทีม"},
fil:{tag:"Electronics, hands-on",h1a:"Parallel",h1b:"circuit",hero:"Isang circuit na puwede mong sirain, baliktarin at sukatin. Mag-scroll pababa at simulan mo nang hawakan.",idea:"Ang ideya sa 3 card",c1t:"Maraming daan",c1p:"Bawat bahagi ay direktang nakakabit sa baterya sa sarili nitong sanga.",c2t:"Parehong boltahe",c2p:"Bawat sanga ay nakakakuha ng buong boltahe ng baterya.",c3t:"Nagdadagdagan ang kuryente",c3p:"Ang baterya ang nagbibigay ng kabuuan ng kuryente ng lahat ng sanga.",lab:"Buuin, tapos sirain",labp:"Magpalit sa parallel o series, i-drag ang boltahe, i-tap ang bumbilya para alisin. 6 V ang rating ng mga bumbilya.",par:"Parallel",ser:"Series",vb:"boltahe sa bumbilya",cur:"kuryente mula sa baterya",rt:"kabuuang resistance",open:"putol",rem:"inalis",m_none:"Bukas ang lahat ng sanga: walang daan, walang kuryente.",m_out:"Patay ang isang bumbilya pero walang nagbago sa iba. May sariling daan ang bawat sanga, kaya parallel ang mga saksakan sa bahay.",m_all:"Bawat bumbilya ay nakakakuha ng buong {0} V, kaya pare-pareho ang liwanag. I-tap ang bumbilya para alisin.",m_sbreak:"May nawawalang bumbilya, kaya putol ang nag-iisang daan at dumilim ang lahat.",m_sdim:"Hinahati sa mga bumbilya ang {0} V ({1} V), kaya malabo ang ilaw. Subukan ang 12 V.",pol:"Bakit mahalaga ang plus at minus",polp:"Baliktarin ang baterya, tapos tanggalin ang resistor.",flip:"Baliktarin ang baterya",resOn:"Resistor: ON",resOff:"Resistor: OFF",reset:"I-reset",resistor:"resistor",anode:"anode (+)",cathode:"cathode (−)",p_ok:"Gumagana: pumapasok ang kuryente sa mahabang binti (+), lumalabas sa maikling binti (−), at pinapanatili itong ligtas ng resistor.",p_burn:"Nasunog: walang naglilimita sa kuryente. Laging gumamit ng resistor sa LED.",p_rev:"Baligtad: hinaharangan ng LED ang kuryente at hindi sumisindi. Sa mas mataas na boltahe, puwede itong masira.",calc:"Resistance calculator",calcsay:"Mas mababa ang parallel ({0} Ω) kaysa sa dalawang resistor: mas maraming daan, mas mababang resistance.",build:"Checklist sa pagbuo",buildp:"I-tap ang bawat hakbang kapag natapos mo.",s1:"Kumuha ng power source at dalawang wire: pula at itim",s2:"Gumawa ng dalawang riles: positibo at negatibo",s3:"Ikabit ang bawat bahagi sa pagitan ng mga riles: plus sa plus, minus sa minus",s4:"Bigyan ang bawat LED ng sarili nitong resistor na naka-series",s5:"Opsyonal: magdagdag ng switch sa bawat sanga",s6:"Siguraduhing hindi dumidikit ang plus sa minus, saka buksan",done:"Tapos na. Puwede mo nang buksan.",team:"Ang aming koponan",leader:"Group leader",members:"Mga miyembro ng koponan"},
hi:{tag:"इलेक्ट्रॉनिक्स, करके सीखें",h1a:"समानांतर",h1b:"परिपथ",hero:"एक ऐसा परिपथ जिसे आप तोड़ सकते हैं, पलट सकते हैं और नाप सकते हैं। नीचे स्क्रॉल करें और छूकर देखें।",idea:"3 कार्ड में विचार",c1t:"कई रास्ते",c1p:"हर अवयव अपनी शाखा में सीधे बैटरी से जुड़ा होता है।",c2t:"समान वोल्टेज",c2p:"हर शाखा को बैटरी का पूरा वोल्टेज मिलता है।",c3t:"धाराएँ जुड़ती हैं",c3p:"बैटरी सभी शाखाओं की धाराओं का योग देती है।",lab:"बनाइए, फिर तोड़िए",labp:"समानांतर और श्रेणी के बीच बदलें, वोल्टेज खींचें, बल्ब हटाने के लिए उसे टैप करें। बल्ब 6 V के हैं।",par:"समानांतर",ser:"श्रेणी",vb:"बल्ब पर वोल्टेज",cur:"बैटरी से धारा",rt:"कुल प्रतिरोध",open:"खुला",rem:"हटाया गया",m_none:"सभी शाखाएँ खुली हैं: कोई रास्ता नहीं, कोई धारा नहीं।",m_out:"एक बल्ब बुझा है, पर बाकी वैसे ही हैं। हर शाखा का अपना रास्ता है, इसीलिए घर के सॉकेट समानांतर जुड़े होते हैं।",m_all:"हर बल्ब को पूरा {0} V मिलता है, इसलिए सब एक जैसे चमकते हैं। बल्ब हटाने के लिए उसे टैप करें।",m_sbreak:"एक बल्ब नहीं है, इसलिए एकमात्र रास्ता टूट गया और सब बुझ गया।",m_sdim:"{0} V बल्बों में बँट जाता है ({1} V), इसलिए वे मद्धम जलते हैं। 12 V आज़माएँ।",pol:"धन और ऋण क्यों मायने रखते हैं",polp:"बैटरी पलटिए, फिर प्रतिरोधक हटाइए।",flip:"बैटरी पलटें",resOn:"प्रतिरोधक: चालू",resOff:"प्रतिरोधक: बंद",reset:"रीसेट",resistor:"प्रतिरोधक",anode:"एनोड (+)",cathode:"कैथोड (−)",p_ok:"चलता है: धारा लंबे पैर (+) से आती है, छोटे पैर (−) से निकलती है, और प्रतिरोधक उसे सुरक्षित रखता है।",p_burn:"जल गया: धारा को कोई सीमित नहीं कर रहा। LED के साथ हमेशा प्रतिरोधक लगाएँ।",p_rev:"उलटा: LED धारा रोकती है और नहीं जलती। ज़्यादा वोल्टेज पर वह खराब हो सकती है।",calc:"प्रतिरोध कैलकुलेटर",calcsay:"समानांतर ({0} Ω) दोनों प्रतिरोधकों से कम है: ज़्यादा रास्ते, कम प्रतिरोध।",build:"बनाने की चेकलिस्ट",buildp:"हर कदम पूरा होते ही उसे टैप करें।",s1:"एक बिजली स्रोत और दो तार लें: लाल और काला",s2:"दो रेल बनाएँ: धन और ऋण",s3:"हर अवयव को रेलों के बीच जोड़ें: धन से धन, ऋण से ऋण",s4:"हर LED के साथ श्रेणी में उसका अपना प्रतिरोधक लगाएँ",s5:"वैकल्पिक: हर शाखा में एक स्विच जोड़ें",s6:"जाँचें कि धन कहीं ऋण को नहीं छू रहा, फिर चालू करें",done:"हो गया। अब चालू कर सकते हैं।",team:"हमारी टीम",leader:"ग्रुप लीडर",members:"टीम के सदस्य"},

function t(k,a,b){var s=(L[lang]&&L[lang][k])||L.en[k];return s.replace("{0}",a).replace("{1}",b)}
var R=[10,20,40],X=[190,320,450],mode="parallel",V=6,on=[true,true,true];

function sim(){
  var I=[0,0,0],Vb=[0,0,0],Rt=Infinity,It=0,i,g=0;
  if(mode==="parallel"){
    for(i=0;i<3;i++)if(on[i]){Vb[i]=V;I[i]=V/R[i];g+=1/R[i];It+=I[i]}
    Rt=g?1/g:Infinity;
  }else if(on[0]&&on[1]&&on[2]){
    Rt=R[0]+R[1]+R[2];It=V/Rt;
    for(i=0;i<3;i++){I[i]=It;Vb[i]=It*R[i]}
  }
  return{I:I,Vb:Vb,Rt:Rt,It:It};
}
function dur(i){return Math.max(.35,Math.min(4,.6/i)).toFixed(2)+"s"}

function bulb(x,y,i,s){
  var o=on[i],gl=o?Math.min(1,Math.pow(s.Vb[i]/6,2)):0,h="";
  h+='<g data-i="'+i+'" transform="translate('+x+','+y+')" style="cursor:pointer">';
  h+='<circle r="34" fill="#232A35" stroke="'+(o?"#9aa7bd":"#566175")+'" stroke-width="4"'+(o?"":' stroke-dasharray="7 7"')+'/>';
  if(o){
    h+='<circle r="'+(34+gl*22).toFixed(0)+'" fill="#FFD23F" opacity="'+(gl*.18).toFixed(2)+'"/><circle r="34" fill="#FFD23F" opacity="'+gl.toFixed(2)+'"/>';
    h+='<path d="M-14,12 L-7,-8 L0,12 L7,-8 L14,12" fill="none" stroke="'+(gl>.5?"#7a5200":"#9aa7bd")+'" stroke-width="3" stroke-linecap="round"/>';
  }else h+='<text y="9" text-anchor="middle" font-size="28" fill="#8892a6">✕</text>';
  h+='<text y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#cfcabf">'+R[i]+' Ω</text>';
  h+='<text y="82" text-anchor="middle" font-size="15" fill="#9aa4b5">'+(o?s.I[i].toFixed(2)+" A":t("rem"))+'</text></g>';
  return h;
}
function battery(){
  return '<path class="wire" d="M60,110V150M60,170V230"/><path d="M38,150H82" stroke="#FF6B5E" stroke-width="6" stroke-linecap="round"/><path d="M48,172H72" stroke="#4DA3FF" stroke-width="6" stroke-linecap="round"/>'+
  '<text x="96" y="156" font-size="24" font-weight="800" fill="#FF6B5E">+</text><text x="98" y="182" font-size="26" font-weight="800" fill="#4DA3FF">−</text>';
}

    for(i=0;i<3;i++)if(on[i])h+='<path class="flow" style="animation-duration:'+dur(s.I[i])+'" d="M60,110V60H'+X[i]+'V280H60V230"/>';
    h+=battery();
    for(i=0;i<3;i++)h+=bulb(X[i],170,i,s);
  }else{
    h+='<path class="wire" d="M60,110V60H540V280H60V230"/>';

  $("#sI").textContent=s.It.toFixed(2)+" A";
  $("#sR").textContent=isFinite(s.Rt)?s.Rt.toFixed(1)+" Ω":t("open");

  if(mode==="parallel"){if(!n){tx=t("m_none");c+=" bad"}else if(n<3){tx=t("m_out");c+=" good"}else tx=t("m_all",V)}

/* calculator */
function calc(){
  var a=Math.max(1,+$("#r1").value||1),b=Math.max(1,+$("#r2").value||1),s=a+b,p=a*b/(a+b),m=s;
  function row(l,v,c){return '<div style="width:'+Math.max(18,v/m*100)+'%;background:'+c+'">'+l+' '+(Math.round(v*100)/100)+' Ω</div>'}
  $("#bars").innerHTML=row(t("ser"),s,"#F5A623")+row(t("par"),p,"#3CFF8A")+row("R₁",a,"#8892a6")+row("R₂",b,"#8892a6");

/* falling-letters headline effect */
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
function fall(){
  if(RM)return;
  var grouped=!(lang==="zh"||lang==="ur"||lang==="hi"||lang==="th"),byWord=(lang==="ur"||lang==="hi"||lang==="th");
  [].forEach.call(document.querySelectorAll("h1,h2"),function(h){
    var n=0,full=[];
    h.style.setProperty("--st",byWord?"150ms":"42ms");
    [].forEach.call(h.querySelectorAll("[data-t]"),function(e){
      var txt=t(e.getAttribute("data-t")),words=txt.split(" ");
      full.push(txt);e.textContent="";
      function unit(ch,par){
        var s=document.createElement("span");s.className="lt";s.setAttribute("aria-hidden","true");s.textContent=ch;
        s.style.setProperty("--i",n++);
        s.style.setProperty("--r",(Math.random()*36-18).toFixed(1)+"deg");
        s.style.setProperty("--h",(90+Math.floor(Math.random()*90))+"px");
        par.appendChild(s);
      }
      words.forEach(function(w,wi){
        if(byWord)unit(w,e);
        else if(grouped){var ws=document.createElement("span");ws.className="w";Array.from(w).forEach(function(ch){unit(ch,ws)});e.appendChild(ws)}
        else Array.from(w).forEach(function(ch){unit(ch,e)});
        if(wi<words.length-1)e.appendChild(document.createTextNode(" "));
      });
    });
    h.setAttribute("aria-label",full.join(" "));
  });
}

/* buttery mouse-wheel scrolling (desktop mouse only; touch and trackpads stay native) */
(function(){
  if(RM||!window.matchMedia||!matchMedia("(hover:hover) and (pointer:fine)").matches)return;
  var de=document.documentElement,target=0,cur=0,raf=0,prev=0;

  function tick(now){
    var dt=Math.min(50,now-prev)/16.7;prev=now;

    cur+=d*(1-Math.pow(1-.11,dt));
    window.scrollTo({top:cur,behavior:"instant"});
    raf=requestAnimationFrame(tick);
  }
  function inner(el){
    while(el&&el!==document.body&&el!==de){
      var o=getComputedStyle(el).overflowY;
      if((o==="auto"||o==="scroll")&&el.scrollHeight>el.clientHeight+1)return true;
      el=el.parentElement;
    }
    return false;
  }
  addEventListener("wheel",function(e){
    if(e.ctrlKey||e.metaKey||e.defaultPrevented||e.deltaX&&Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    if(inner(e.target))return;
    var dy=e.deltaY*(e.deltaMode===1?34:e.deltaMode===2?innerHeight:1);
    if(e.deltaMode===0&&Math.abs(dy)<40){ /* trackpad: leave it native */
      if(raf){cancelAnimationFrame(raf);raf=0}return;
    }
    e.preventDefault();
    if(!raf){cur=window.scrollY;target=cur;prev=performance.now()}
    target=Math.max(0,Math.min(maxY(),target+dy));
    if(!raf)raf=requestAnimationFrame(tick);
  },{passive:false});
  addEventListener("scroll",function(){if(!raf){cur=target=window.scrollY}},{passive:true});
})();

/* reveal */
var secs=document.querySelectorAll("section");
if("IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:0,rootMargin:"0px 0px 15% 0px"});
  secs.forEach(function(s){io.observe(s)});
}else secs.forEach(function(s){s.classList.add("in")});
})();
</script>
