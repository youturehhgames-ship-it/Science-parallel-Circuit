<style>
*{box-sizing:border-box}
:root{--bg:#14181F;--card:#232A35;--ink:#F2EFE8;--amb:#F5A623;--red:#FF6B5E;--blue:#4DA3FF;--grn:#3CFF8A}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,"Noto Sans TC","Noto Sans Thai","Noto Sans Devanagari","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
section{padding:clamp(48px,8vw,100px) clamp(18px,5vw,60px);max-width:1100px;margin:0 auto;opacity:0;transform:translateY(36px)}
section.in{opacity:1;transform:none}
/* pixel / Minecraft look */
section{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;image-rendering:pixelated}
@keyframes pxin{0%{opacity:0;transform:translateY(24px)}50%{opacity:1}100%{opacity:1;transform:none}}
html:not(.pxwait) .hero>:not(h1){animation:pxin 1s cubic-bezier(.22,1,.36,1) both}
html:not(.pxwait) .hero>:nth-child(3){animation-delay:1.1s}
svg.off .flow{animation-play-state:paused}
.hero h1{text-shadow:.055em .055em 0 rgba(0,0,0,.5)}
.hero h1 .amb{text-shadow:.055em .055em 0 #7a3a05}
.card b{text-shadow:3px 3px 0 rgba(122,58,5,.6)}
@media(prefers-reduced-motion:reduce){html:not(.pxwait) .hero>*{animation:none}section{transition:none}}
h1{font-size:clamp(42px,9vw,104px);font-weight:800;line-height:1.02;margin:0 0 18px}
h2{font-size:clamp(28px,5vw,52px);font-weight:800;margin:0 0 10px}
h3{font-size:20px;margin:0 0 8px}
p{font-size:clamp(16px,2vw,20px);line-height:1.5;margin:0 0 14px;color:#cfcabf}
.amb{color:var(--amb)}
.hero{min-height:92vh;min-height:92svh;display:flex;flex-direction:column;justify-content:center}
.hero .tag{color:var(--amb);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border-radius:20px;padding:22px}
.card b{display:block;color:var(--amb);font-size:34px;margin-bottom:6px}
.panel{background:var(--card);border-radius:24px;padding:clamp(14px,3vw,28px);margin-top:20px}
svg{direction:ltr;width:100%;height:auto;display:block;touch-action:manipulation}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:600 16px Inter,sans-serif;border:0;border-radius:999px;padding:12px 20px;background:#323b4b;color:var(--ink);cursor:pointer}
button.on{background:var(--amb);color:#14181F}
button:active{transform:scale(.97)}
input[type=range]{flex:1;min-width:140px;accent-color:var(--amb);height:28px}
input[type=number]{width:100px;font:600 18px Inter,sans-serif;background:#14181F;color:var(--ink);border:2px solid #3a4352;border-radius:12px;padding:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#1b212b;border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:clamp(20px,4vw,32px);color:var(--amb)}
.stat span{font-size:13px;color:#9aa4b5}
.say{background:#1b212b;border-inline-start:6px solid var(--amb);border-radius:12px;padding:14px 16px;font-size:clamp(15px,2vw,19px);line-height:1.45;min-height:3.6em}
.say.bad{border-color:var(--red)}.say.good{border-color:var(--grn)}
.flow{fill:none;stroke:#FFD23F;stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 16;animation:fl linear infinite}
@keyframes fl{to{stroke-dashoffset:-16.1}}
.wire{fill:none;stroke:#566175;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg text{font-family:Inter,sans-serif}
.bars div{height:30px;border-radius:8px;margin:8px 0;display:flex;align-items:center;padding-inline-start:12px;font-weight:600;color:#14181F;transition:width .3s;white-space:nowrap}
.steps{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.steps button{width:100%;text-align:start;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-weight:400;font-size:clamp(15px,2vw,19px)}
.steps button i{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid #566175;display:grid;place-items:center;font-style:normal;font-weight:800}
.steps button.done{background:#1f3a2c}.steps button.done i{background:var(--grn);border-color:var(--grn);color:#14181F}
.prog{height:12px;background:#1b212b;border-radius:99px;overflow:hidden}.prog div{height:100%;width:0;background:var(--grn);transition:width .4s}
#lg{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline-end:10px;z-index:10;background:#F5A623;color:#14181F;border:0;border-radius:999px;padding:10px 14px;font:600 15px Inter,sans-serif}
.tm{text-align:center}.av{width:72px;height:72px;border-radius:50%;background:#323b4b;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--amb)}.lead .av{background:var(--amb);color:#14181F}.tm small{display:block;color:#9aa4b5;margin-bottom:4px;font-size:14px}.nm{font-size:22px;font-weight:800}
@media(max-width:600px){.stats{gap:6px}.stat{padding:8px 4px}}
/* letters fall from above, slightly tilted, and land upright */
.w{display:inline-block;white-space:nowrap}
.lt{display:inline-block;opacity:0}
@keyframes drop{
  0%{opacity:0;transform:translateY(calc(var(--h) * -1)) rotate(var(--r));animation-timing-function:cubic-bezier(.55,0,.9,.5)}
  12%{opacity:1}
  68%{opacity:1;transform:translateY(0) rotate(0deg);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  84%{opacity:1;transform:translateY(-.1em) rotate(0deg)}
  100%{opacity:1;transform:none}
}
section.in .lt{animation:drop .8s both;animation-delay:calc(var(--i) * var(--st,42ms) + 150ms)}
/* 3D model viewer */
.spin{position:relative;direction:ltr;aspect-ratio:4/3;max-height:80vh;width:100%;background:#1b212b;border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px var(--amb),6px 6px 0 4px #7a3a05}
.spin canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spin canvas:active{cursor:grabbing}
/* ===== extra animations ===== */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 28%,rgba(245,166,35,.13),transparent 38%),radial-gradient(circle at 82% 72%,rgba(77,163,255,.11),transparent 40%),radial-gradient(circle at 60% 12%,rgba(60,255,138,.07),transparent 30%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:32px 32px}
#sp{position:fixed;top:0;left:0;width:100%;height:5px;background:var(--amb);box-shadow:0 3px 0 #7a3a05;transform:scaleX(0);transform-origin:0 50%;z-index:10000;pointer-events:none}
#px{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#px i{position:absolute;bottom:-30px;display:block;opacity:0}
h2{position:relative;padding-bottom:16px}
h2::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--amb);box-shadow:3px 3px 0 #7a3a05;transition:width .9s cubic-bezier(.22,1,.36,1) .5s}
section.in h2::after{width:84px}
[dir=rtl] h2::after{left:auto;right:0}
.card,.stat,.av{transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background .3s}
.card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 0 0 3px var(--amb),6px 6px 0 3px #7a3a05}
.panel{transition:box-shadow .4s}
.panel:hover{box-shadow:0 0 0 2px rgba(245,166,35,.55),0 16px 50px rgba(0,0,0,.35)}
.stat:hover{transform:scale(1.06)}
.tm:hover .av{transform:scale(1.12) rotate(-6deg)}
@media(prefers-reduced-motion:no-preference){
  @keyframes inL{0%{opacity:0;transform:translateX(-90px) rotate(-1.5deg)}60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes inR{0%{opacity:0;transform:translateX(90px) rotate(1.5deg)}60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes inU{0%{opacity:0;transform:translateY(60px) scale(.92)}100%{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
  @keyframes zoomIn{0%{opacity:0;transform:perspective(900px) rotateY(-24deg) scale(.82)}100%{opacity:1;transform:none}}
  @keyframes glowP{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}50%{box-shadow:0 0 18px 3px rgba(245,166,35,.55)}}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.6)}50%{box-shadow:0 0 0 12px rgba(245,166,35,0)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes drift{to{transform:translate(4%,-3%) rotate(6deg) scale(1.08)}}
  @keyframes rise{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:var(--o)}88%{opacity:var(--o)}100%{opacity:0;transform:translateY(-115vh) rotate(200deg)}}
  body::before{animation:drift 26s ease-in-out infinite alternate}
  #px i{animation:rise var(--d) linear var(--w) infinite}
  /* panels slide in from the sides, one left, one right */
  section.in .panel{animation:inL 1s cubic-bezier(.22,1,.36,1) .2s backwards}
  section.in:nth-of-type(even) .panel{animation-name:inR}
  /* cards: first from the left, last from the right, middle from below */
  section.in .cards>.card{animation:inU .9s cubic-bezier(.22,1,.36,1) .3s backwards}
  section.in .cards>.card:first-child{animation-name:inL}
  section.in .cards>.card:last-child{animation-name:inR}
  section.in .cards>.card:nth-child(2){animation-delay:.45s}
  section.in .cards>.card:last-child{animation-delay:.6s}
  section.in .stat{animation:pop .7s cubic-bezier(.34,1.56,.64,1) backwards}
  section.in .stat:nth-child(1){animation-delay:.7s}
  section.in .stat:nth-child(2){animation-delay:.85s}
  section.in .stat:nth-child(3){animation-delay:1s}
  section.in .bar>*{animation:pop .6s cubic-bezier(.34,1.56,.64,1) backwards}
  section.in .bar>:nth-child(1){animation-delay:.5s}
  section.in .bar>:nth-child(2){animation-delay:.6s}
  section.in .bar>:nth-child(3){animation-delay:.7s}
  section.in .bar>:nth-child(4){animation-delay:.8s}
  section.in .spin{animation:zoomIn 1.2s cubic-bezier(.22,1,.36,1) .5s backwards}
  section.in .av{animation:pop .8s cubic-bezier(.34,1.56,.64,1) .7s backwards}
  .lead .av{animation:ring 2.4s ease-out 1.6s infinite}
  button.on{animation:glowP 2.4s ease-in-out infinite}
  .hero .tag{animation:floaty 3.6s ease-in-out infinite}
  .hero::after{content:"\2193";position:absolute;bottom:20px;left:50%;margin-left:-14px;font-size:34px;font-weight:800;color:var(--amb);text-shadow:3px 3px 0 #7a3a05;animation:bob 1.6s ease-in-out infinite}
  .hero{position:relative}
}
</style>

<script>
/* pixel particles: yellow-orange squares pop up and fall when you press interactive controls */
(function(){
var c=document.getElementById("fx");if(!c)return;
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){c.remove();return}
var x=c.getContext("2d"),P=["#FFF1A8","#FFD23F","#FFD23F","#F5A623","#F5A623","#FF8C1A","#E8590C"],parts=[],run=false,last=0,lastSlide=0;
function size(){c.width=innerWidth;c.height=innerHeight}
size();addEventListener("resize",size);
function spawn(px,py,n,spread){
  for(var i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*(spread||6),vy:-Math.random()*4-1.5,s:[4,6,8][Math.random()*3|0],c:P[Math.random()*P.length|0],l:1});
  if(!run){run=true;c.style.display="block";last=performance.now();requestAnimationFrame(loop)}
}
function loop(now){
  var dt=Math.min(40,now-last)/16.7;last=now;
  x.clearRect(0,0,c.width,c.height);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.28*dt;p.l-=.012*dt;
    if(p.l<=0||p.y>c.height+20){parts.splice(i,1);continue}
    if(p.l<.3&&Math.floor(p.l*30)%2)continue;
    x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.s,p.s);
    x.fillStyle="rgba(0,0,0,.25)";x.fillRect(p.x|0,(p.y|0)+p.s-2,p.s,2);
  }
  if(parts.length)requestAnimationFrame(loop);else{run=false;x.clearRect(0,0,c.width,c.height);c.style.display="none"}
}
document.addEventListener("pointerdown",function(e){
  var t=e.target.closest&&e.target.closest("button,g[data-i]");
  if(t)spawn(e.clientX,e.clientY,16,7);
},true);
document.addEventListener("input",function(e){
  var t=e.target;if(!t||t.type!=="range")return;
  var n=performance.now();if(n-lastSlide<60)return;lastSlide=n;
  var r=t.getBoundingClientRect(),f=(t.value-t.min)/(t.max-t.min);
  spawn(r.left+12+f*(r.width-24),r.top+r.height/2,4,3);
});
})();
</script>

en:{tag:"Electronics, hands-on",h1a:"Parallel",h1b:"circuit",hero:"A circuit you can break, flip and measure. Scroll down and start touching things.",idea:"The idea in 3 cards",c1t:"Many paths",c1p:"Each component connects straight to the battery on its own branch.",c2t:"Same voltage",c2p:"Every branch gets the full battery voltage.",c3t:"Currents add up",c3p:"The battery supplies the sum of all branch currents.",lab:"Build it, then break it",labp:"Switch parallel or series, drag the voltage, tap a bulb to remove it. Bulbs are rated 6 V.",par:"Parallel",ser:"Series",vb:"voltage on a bulb",cur:"current from battery",rt:"total resistance",open:"open",rem:"removed",m_none:"All branches are open: no path, no current.",m_out:"A bulb is out but the others did not change. Each branch is its own path, which is why home sockets are wired in parallel.",m_all:"Every bulb gets the full {0} V, so all glow the same. Tap a bulb to remove it.",m_sbreak:"A bulb is missing, so the only path is broken and everything goes dark.",m_sdim:"The {0} V is shared between the bulbs ({1} V), so they glow dim. Try 12 V.",pol:"Why plus and minus matter",polp:"Flip the battery, then take the resistor out.",flip:"Flip battery",resOn:"Resistor: ON",resOff:"Resistor: OFF",reset:"Reset",resistor:"resistor",anode:"anode (+)",cathode:"cathode (−)",p_ok:"Works: current enters the long leg (+), leaves the short leg (−), and the resistor keeps it safe.",p_burn:"Burned out: nothing limits the current. Always use a resistor with an LED.",p_rev:"Reversed: the LED blocks the current and stays dark. At higher voltage it can be damaged.",calc:"Resistance calculator",calcsay:"Parallel ({0} Ω) is lower than both resistors: more paths, less resistance.",build:"Build checklist",buildp:"Tap each step as you do it.",s1:"Take a power source and two wires: red and black",s2:"Make two rails: positive and negative",s3:"Connect each component between the rails: plus to plus, minus to minus",s4:"Give each LED its own resistor in series",s5:"Optional: add a switch to each branch",s6:"Check that plus never touches minus, then power on",done:"Done. You can power it on.",team:"Our team",leader:"Group leader",members:"Team members",spinT:"Our model in 3D",spinP:"Drag to spin it, scroll or pinch to zoom, and flip the switch to light the bulbs.",modOn:"Power: ON",modOff:"Power: OFF",auto:"Auto-rotate"},
ru:{tag:"Электроника на практике",h1a:"Параллельная",h1b:"цепь",hero:"Цепь, которую можно ломать, переворачивать и измерять. Листай вниз и трогай всё.",idea:"Идея в трёх карточках",c1t:"Много путей",c1p:"Каждый элемент подключён прямо к батарее на своей ветке.",c2t:"Одно напряжение",c2p:"Каждая ветка получает полное напряжение батареи.",c3t:"Токи складываются",c3p:"Батарея отдаёт сумму токов всех веток.",lab:"Собери и сломай",labp:"Переключай параллельную и последовательную, двигай напряжение, нажми на лампу, чтобы убрать её. Лампы рассчитаны на 6 В.",par:"Параллельная",ser:"Последовательная",vb:"напряжение на лампе",cur:"ток от батареи",rt:"общее сопротивление",open:"обрыв",rem:"убрана",m_none:"Все ветки разомкнуты: пути нет, тока нет.",m_out:"Одна лампа выключена, а остальные не изменились. У каждой ветки свой путь, поэтому розетки дома подключены параллельно.",m_all:"Каждая лампа получает полные {0} В, поэтому все светят одинаково. Нажми на лампу, чтобы убрать её.",m_sbreak:"Лампы нет, единственный путь разорван и всё погасло.",m_sdim:"Напряжение {0} В делится между лампами ({1} В), поэтому они горят тускло. Попробуй 12 В.",pol:"Почему важны плюс и минус",polp:"Переверни батарею, потом убери резистор.",flip:"Перевернуть батарею",resOn:"Резистор: ВКЛ",resOff:"Резистор: ВЫКЛ",reset:"Сброс",resistor:"резистор",anode:"анод (+)",cathode:"катод (−)",p_ok:"Работает: ток входит в длинную ножку (+), выходит из короткой (−), а резистор держит его в безопасных пределах.",p_burn:"Сгорел: ничто не ограничивает ток. Со светодиодом всегда нужен резистор.",p_rev:"Наоборот: светодиод не пропускает ток и не светит. При большем напряжении его можно повредить.",calc:"Калькулятор сопротивления",calcsay:"Параллельное ({0} Ом) меньше обоих резисторов: больше путей, меньше сопротивление.",build:"Чек-лист сборки",buildp:"Отмечай каждый шаг, когда сделаешь.",s1:"Возьми источник питания и два провода: красный и чёрный",s2:"Сделай две шины: плюсовую и минусовую",s3:"Подключи каждый элемент между шинами: плюс к плюсу, минус к минусу",s4:"Каждому светодиоду поставь свой резистор последовательно",s5:"По желанию добавь выключатель на каждую ветку",s6:"Проверь, что плюс нигде не касается минуса, и включай",done:"Готово. Можно включать.",team:"Наша команда",leader:"Руководитель группы",members:"Участники",spinT:"Наша модель в 3D",spinP:"Тяни, чтобы вращать, колёсико или щипок — приблизить. Включи питание, чтобы зажечь лампочки.",modOn:"Питание: ВКЛ",modOff:"Питание: ВЫКЛ",auto:"Авто-вращение"},
zh:{tag:"電子學實作",h1a:"並聯",h1b:"電路",hero:"一個可以拆、可以翻、可以測量的電路。往下捲動，動手試試。",idea:"三張卡片看懂概念",c1t:"多條路徑",c1p:"每個元件各自在一條支路上直接連到電池。",c2t:"電壓相同",c2p:"每條支路都得到電池的完整電壓。",c3t:"電流相加",c3p:"電池供應所有支路電流的總和。",lab:"先組裝，再弄壞",labp:"切換並聯或串聯，拖曳電壓，點燈泡即可移除。燈泡額定 6 V。",par:"並聯",ser:"串聯",vb:"燈泡電壓",cur:"電池輸出電流",rt:"總電阻",open:"斷路",rem:"已移除",m_none:"所有支路都斷開：沒有路徑，沒有電流。",m_out:"一顆燈泡熄滅了，其他燈泡完全不受影響。每條支路都有自己的路徑，這就是家中插座採用並聯的原因。",m_all:"每顆燈泡都得到完整的 {0} V，所以亮度相同。點燈泡可移除它。",m_sbreak:"少了一顆燈泡，唯一的路徑斷了，全部熄滅。",m_sdim:"{0} V 由燈泡分攤（{1} V），所以都很暗。試試 12 V。",pol:"為什麼正負極很重要",polp:"翻轉電池，然後把電阻拿掉。",flip:"翻轉電池",resOn:"電阻：開",resOff:"電阻：關",reset:"重設",resistor:"電阻",anode:"陽極 (+)",cathode:"陰極 (−)",p_ok:"正常：電流從長腳 (+) 進入，從短腳 (−) 流出，電阻讓電流保持安全。",p_burn:"燒壞了：沒有任何東西限制電流。LED 一定要搭配電阻。",p_rev:"接反了：LED 擋住電流，不會亮。電壓較高時還可能損壞。",calc:"電阻計算器",calcsay:"並聯 ({0} Ω) 比兩個電阻都小：路徑越多，電阻越小。",build:"組裝清單",buildp:"完成每一步就點一下。",s1:"準備電源和兩條導線：紅色和黑色",s2:"做出正負兩條匯流排",s3:"把每個元件接在兩條匯流排之間：正接正，負接負",s4:"每顆 LED 各自串聯一個電阻",s5:"可選：在每條支路加一個開關",s6:"確認正極沒有碰到負極，再通電",done:"完成，可以通電了。",team:"我們的團隊",leader:"組長",members:"組員",spinT:"我們的 3D 模型",spinP:"拖動旋轉，滾輪或雙指縮放。打開電源讓燈泡亮起來。",modOn:"電源：開",modOff:"電源：關",auto:"自動旋轉"},
tr:{tag:"Elektronik, uygulamalı",h1a:"Paralel",h1b:"devre",hero:"Bozabileceğin, ters çevirebileceğin ve ölçebileceğin bir devre. Aşağı kaydır ve dokunmaya başla.",idea:"Fikir 3 kartta",c1t:"Çok yol",c1p:"Her eleman kendi kolunda doğrudan pile bağlıdır.",c2t:"Aynı gerilim",c2p:"Her kol pilin tüm gerilimini alır.",c3t:"Akımlar toplanır",c3p:"Pil, tüm kolların akımlarının toplamını sağlar.",lab:"Kur, sonra boz",labp:"Paralel ve seri arasında geçiş yap, gerilimi sürükle, kaldırmak için ampule dokun. Ampuller 6 V içindir.",par:"Paralel",ser:"Seri",vb:"ampul gerilimi",cur:"pilden çekilen akım",rt:"toplam direnç",open:"açık",rem:"çıkarıldı",m_none:"Tüm kollar açık: yol yok, akım yok.",m_out:"Bir ampul söndü ama diğerleri değişmedi. Her kolun kendi yolu var, evdeki prizlerin paralel bağlanmasının nedeni budur.",m_all:"Her ampul tam {0} V alır, bu yüzden hepsi aynı parlar. Kaldırmak için ampule dokun.",m_sbreak:"Bir ampul eksik, tek yol kesildi ve her şey karardı.",m_sdim:"{0} V ampuller arasında paylaşılır ({1} V), bu yüzden sönük yanarlar. 12 V dene.",pol:"Artı ve eksi neden önemli",polp:"Pili ters çevir, sonra direnci çıkar.",flip:"Pili ters çevir",resOn:"Direnç: AÇIK",resOff:"Direnç: KAPALI",reset:"Sıfırla",resistor:"direnç",anode:"anot (+)",cathode:"katot (−)",p_ok:"Çalışır: akım uzun bacaktan (+) girer, kısa bacaktan (−) çıkar, direnç de onu güvenli tutar.",p_burn:"Yandı: akımı hiçbir şey sınırlamıyor. LED ile her zaman direnç kullan.",p_rev:"Ters: LED akımı engeller ve yanmaz. Yüksek gerilimde zarar görebilir.",calc:"Direnç hesaplayıcı",calcsay:"Paralel ({0} Ω) iki dirençten de küçüktür: daha çok yol, daha az direnç.",build:"Kurulum listesi",buildp:"Her adımı yaptıkça dokun.",s1:"Bir güç kaynağı ve iki kablo al: kırmızı ve siyah",s2:"İki ray yap: artı ve eksi",s3:"Her elemanı raylar arasına bağla: artıyı artıya, eksiyi eksiye",s4:"Her LED'e seri olarak kendi direncini ver",s5:"İsteğe bağlı: her kola bir anahtar ekle",s6:"Artının eksiye hiçbir yerde değmediğini kontrol et, sonra çalıştır",done:"Tamam. Çalıştırabilirsin.",team:"Ekibimiz",leader:"Grup lideri",members:"Ekip üyeleri",spinT:"3D modelimiz",spinP:"Döndürmek için sürükle, yakınlaştırmak için kaydır veya parmaklarınla aç-kapa. Ampulleri yakmak için güç düğmesine bas.",modOn:"Güç: AÇIK",modOff:"Güç: KAPALI",auto:"Otomatik döndür"},
th:{tag:"อิเล็กทรอนิกส์ แบบลงมือทำ",h1a:"วงจร",h1b:"ขนาน",hero:"วงจรที่คุณทำพัง พลิกกลับ และวัดค่าได้ เลื่อนลงแล้วลองจับดูเลย",idea:"แนวคิดใน 3 การ์ด",c1t:"หลายเส้นทาง",c1p:"อุปกรณ์แต่ละตัวต่อตรงกับแบตเตอรี่บนแขนงของตัวเอง",c2t:"แรงดันเท่ากัน",c2p:"ทุกแขนงได้รับแรงดันเต็มของแบตเตอรี่",c3t:"กระแสรวมกัน",c3p:"แบตเตอรี่จ่ายกระแสเท่ากับผลรวมของทุกแขนง",lab:"ต่อให้เสร็จ แล้วลองทำให้พัง",labp:"สลับระหว่างขนานกับอนุกรม ลากปรับแรงดัน แตะหลอดไฟเพื่อถอดออก หลอดไฟรับได้ 6 V",par:"ขนาน",ser:"อนุกรม",vb:"แรงดันที่หลอดไฟ",cur:"กระแสจากแบตเตอรี่",rt:"ความต้านทานรวม",open:"ขาดวงจร",rem:"ถอดออก",m_none:"ทุกแขนงเปิดอยู่ จึงไม่มีเส้นทางและไม่มีกระแส",m_out:"หลอดหนึ่งดับ แต่หลอดอื่นไม่เปลี่ยนเลย แต่ละแขนงมีเส้นทางของตัวเอง นี่คือเหตุผลที่ปลั๊กในบ้านต่อแบบขนาน",m_all:"ทุกหลอดได้รับ {0} V เต็ม จึงสว่างเท่ากัน แตะหลอดเพื่อถอดออก",m_sbreak:"ขาดหลอดไปหนึ่งดวง เส้นทางเดียวจึงขาด และทุกอย่างดับหมด",m_sdim:"แรงดัน {0} V ถูกแบ่งให้แต่ละหลอด ({1} V) จึงสว่างน้อย ลอง 12 V ดู",pol:"ทำไมขั้วบวกและลบจึงสำคัญ",polp:"พลิกแบตเตอรี่ แล้วลองถอดตัวต้านทานออก",flip:"พลิกแบตเตอรี่",resOn:"ตัวต้านทาน: เปิด",resOff:"ตัวต้านทาน: ปิด",reset:"รีเซ็ต",resistor:"ตัวต้านทาน",anode:"ขั้วแอโนด (+)",cathode:"ขั้วแคโทด (−)",p_ok:"ทำงานได้: กระแสเข้าขายาว (+) ออกขาสั้น (−) และตัวต้านทานช่วยให้ปลอดภัย",p_burn:"ไหม้แล้ว: ไม่มีอะไรจำกัดกระแส ใช้ LED ต้องมีตัวต้านทานเสมอ",p_rev:"กลับขั้ว: LED กันกระแสไว้และไม่สว่าง ถ้าแรงดันสูงอาจเสียหายได้",calc:"เครื่องคิดเลขความต้านทาน",calcsay:"แบบขนาน ({0} Ω) ต่ำกว่าตัวต้านทานทั้งสองตัว เพราะเส้นทางมากขึ้น ความต้านทานจึงน้อยลง",build:"เช็กลิสต์การต่อวงจร",buildp:"แตะแต่ละขั้นตอนเมื่อทำเสร็จ",s1:"เตรียมแหล่งจ่ายไฟและสายไฟสองเส้น: สีแดงและสีดำ",s2:"ทำรางสองราง: รางบวกและรางลบ",s3:"ต่ออุปกรณ์แต่ละตัวระหว่างราง: บวกเข้าบวก ลบเข้าลบ",s4:"ต่อตัวต้านทานอนุกรมให้ LED แต่ละดวง",s5:"ทางเลือก: เพิ่มสวิตช์ให้แต่ละแขนง",s6:"ตรวจว่าขั้วบวกไม่แตะขั้วลบเลย แล้วจึงเปิดไฟ",done:"เสร็จแล้ว เปิดไฟได้เลย",team:"ทีมของเรา",leader:"หัวหน้ากลุ่ม",members:"สมาชิกในทีม",spinT:"โมเดล 3 มิติของเรา",spinP:"ลากเพื่อหมุน เลื่อนล้อเมาส์หรือใช้สองนิ้วเพื่อซูม แล้วเปิดสวิตช์ให้หลอดไฟสว่าง",modOn:"ไฟ: เปิด",modOff:"ไฟ: ปิด",auto:"หมุนอัตโนมัติ"},
fil:{tag:"Electronics, hands-on",h1a:"Parallel",h1b:"circuit",hero:"Isang circuit na puwede mong sirain, baliktarin at sukatin. Mag-scroll pababa at simulan mo nang hawakan.",idea:"Ang ideya sa 3 card",c1t:"Maraming daan",c1p:"Bawat bahagi ay direktang nakakabit sa baterya sa sarili nitong sanga.",c2t:"Parehong boltahe",c2p:"Bawat sanga ay nakakakuha ng buong boltahe ng baterya.",c3t:"Nagdadagdagan ang kuryente",c3p:"Ang baterya ang nagbibigay ng kabuuan ng kuryente ng lahat ng sanga.",lab:"Buuin, tapos sirain",labp:"Magpalit sa parallel o series, i-drag ang boltahe, i-tap ang bumbilya para alisin. 6 V ang rating ng mga bumbilya.",par:"Parallel",ser:"Series",vb:"boltahe sa bumbilya",cur:"kuryente mula sa baterya",rt:"kabuuang resistance",open:"putol",rem:"inalis",m_none:"Bukas ang lahat ng sanga: walang daan, walang kuryente.",m_out:"Patay ang isang bumbilya pero walang nagbago sa iba. May sariling daan ang bawat sanga, kaya parallel ang mga saksakan sa bahay.",m_all:"Bawat bumbilya ay nakakakuha ng buong {0} V, kaya pare-pareho ang liwanag. I-tap ang bumbilya para alisin.",m_sbreak:"May nawawalang bumbilya, kaya putol ang nag-iisang daan at dumilim ang lahat.",m_sdim:"Hinahati sa mga bumbilya ang {0} V ({1} V), kaya malabo ang ilaw. Subukan ang 12 V.",pol:"Bakit mahalaga ang plus at minus",polp:"Baliktarin ang baterya, tapos tanggalin ang resistor.",flip:"Baliktarin ang baterya",resOn:"Resistor: ON",resOff:"Resistor: OFF",reset:"I-reset",resistor:"resistor",anode:"anode (+)",cathode:"cathode (−)",p_ok:"Gumagana: pumapasok ang kuryente sa mahabang binti (+), lumalabas sa maikling binti (−), at pinapanatili itong ligtas ng resistor.",p_burn:"Nasunog: walang naglilimita sa kuryente. Laging gumamit ng resistor sa LED.",p_rev:"Baligtad: hinaharangan ng LED ang kuryente at hindi sumisindi. Sa mas mataas na boltahe, puwede itong masira.",calc:"Resistance calculator",calcsay:"Mas mababa ang parallel ({0} Ω) kaysa sa dalawang resistor: mas maraming daan, mas mababang resistance.",build:"Checklist sa pagbuo",buildp:"I-tap ang bawat hakbang kapag natapos mo.",s1:"Kumuha ng power source at dalawang wire: pula at itim",s2:"Gumawa ng dalawang riles: positibo at negatibo",s3:"Ikabit ang bawat bahagi sa pagitan ng mga riles: plus sa plus, minus sa minus",s4:"Bigyan ang bawat LED ng sarili nitong resistor na naka-series",s5:"Opsyonal: magdagdag ng switch sa bawat sanga",s6:"Siguraduhing hindi dumidikit ang plus sa minus, saka buksan",done:"Tapos na. Puwede mo nang buksan.",team:"Ang aming koponan",leader:"Group leader",members:"Mga miyembro ng koponan",spinT:"Ang aming 3D na modelo",spinP:"I-drag para paikutin, mag-scroll o mag-pinch para mag-zoom, at i-on ang switch para umilaw ang mga bombilya.",modOn:"Power: ON",modOff:"Power: OFF",auto:"Auto-ikot"},

function t(k,a,b){var s=(L[lang]&&L[lang][k])||L.en[k];return s.replace("{0}",a).replace("{1}",b)}
var R=[10,20,40],X=[190,320,450],mode="parallel",V=6,on=[true,true,true];

function sim(){
  var I=[0,0,0],Vb=[0,0,0],Rt=Infinity,It=0,i,g=0;
  if(mode==="parallel"){
    for(i=0;i<3;i++)if(on[i]){Vb[i]=V;I[i]=V/R[i];g+=1/R[i];It+=I[i]}
    Rt=g?1/g:Infinity;
  }else if(on[0]&&on[1]&&on[2]){
    Rt=R[0]+R[1]+R[2];It=V/Rt;
    for(i=0;i<3;i++){I[i]=It;Vb[i]=It*R[i]}
  }
  return{I:I,Vb:Vb,Rt:Rt,It:It};
}
function dur(i){return Math.max(.35,Math.min(4,.6/i)).toFixed(2)+"s"}

function bulb(x,y,i,s){
  var o=on[i],gl=o?Math.min(1,Math.pow(s.Vb[i]/6,2)):0,h="";
  h+='<g data-i="'+i+'" transform="translate('+x+','+y+')" style="cursor:pointer">';
  h+='<circle r="34" fill="#232A35" stroke="'+(o?"#9aa7bd":"#566175")+'" stroke-width="4"'+(o?"":' stroke-dasharray="7 7"')+'/>';
  if(o){
    h+='<circle r="'+(34+gl*22).toFixed(0)+'" fill="#FFD23F" opacity="'+(gl*.18).toFixed(2)+'"/><circle r="34" fill="#FFD23F" opacity="'+gl.toFixed(2)+'"/>';
    h+='<path d="M-14,12 L-7,-8 L0,12 L7,-8 L14,12" fill="none" stroke="'+(gl>.5?"#7a5200":"#9aa7bd")+'" stroke-width="3" stroke-linecap="round"/>';
  }else h+='<text y="9" text-anchor="middle" font-size="28" fill="#8892a6">✕</text>';
  h+='<text y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#cfcabf">'+R[i]+' Ω</text>';
  h+='<text y="82" text-anchor="middle" font-size="15" fill="#9aa4b5">'+(o?s.I[i].toFixed(2)+" A":t("rem"))+'</text></g>';
  return h;
}
function battery(){
  return '<path class="wire" d="M60,110V150M60,170V230"/><path d="M38,150H82" stroke="#FF6B5E" stroke-width="6" stroke-linecap="round"/><path d="M48,172H72" stroke="#4DA3FF" stroke-width="6" stroke-linecap="round"/>'+
  '<text x="96" y="156" font-size="24" font-weight="800" fill="#FF6B5E">+</text><text x="98" y="182" font-size="26" font-weight="800" fill="#4DA3FF">−</text>';
}
function draw1(){
  var s=sim(),h="",i;
  if(mode==="parallel"){
    h+='<path class="wire" d="M60,110V60H450M60,230V280H450M190,60V280M320,60V280M450,60V280"/>';
    for(i=0;i<3;i++)if(on[i])h+='<path class="flow" style="animation-duration:'+dur(s.I[i])+'" d="M60,110V60H'+X[i]+'V280H60V230"/>';
    h+=battery();
    for(i=0;i<3;i++)h+=bulb(X[i],170,i,s);
  }else{
    h+='<path class="wire" d="M60,110V60H540V280H60V230"/>';
    if(s.It>0)h+='<path class="flow" style="animation-duration:'+dur(s.It)+'" d="M60,110V60H540V280H60V230"/>';
    h+=battery();
    for(i=0;i<3;i++)h+=bulb(X[i],60,i,s);
  }
  $("#c1").innerHTML=h;
  var n=on.filter(Boolean).length,vb=Math.max.apply(null,s.Vb);
  $("#sV").textContent=n&&s.It>0?(mode==="parallel"?V:vb.toFixed(1))+" V":"0 V";
  $("#sI").textContent=s.It.toFixed(2)+" A";
  $("#sR").textContent=isFinite(s.Rt)?s.Rt.toFixed(1)+" Ω":t("open");
  var tx,c="say",V1=s.Vb.map(function(v){return v.toFixed(1)}).join(", ");
  if(mode==="parallel"){if(!n){tx=t("m_none");c+=" bad"}else if(n<3){tx=t("m_out");c+=" good"}else tx=t("m_all",V)}
  else{if(n<3){tx=t("m_sbreak");c+=" bad"}else tx=t("m_sdim",V,V1)}
  $("#say1").className=c;$("#say1").textContent=tx;
}
$("#c1").addEventListener("click",function(e){
  var g=e.target.closest("g[data-i]");if(!g)return;
  var i=+g.getAttribute("data-i");on[i]=!on[i];draw1();
});
$("#mP").onclick=function(){mode="parallel";$("#mP").className="on";$("#mS").className="";draw1()};
$("#mS").onclick=function(){mode="series";$("#mS").className="on";$("#mP").className="";draw1()};
var pend=false;
$("#volt").oninput=function(){V=+this.value;$("#vl").textContent=V+" V";if(!pend){pend=true;requestAnimationFrame(function(){pend=false;draw1()})}};
$("#volt").addEventListener("change",function(){});
draw1();

/* polarity */
var flip=false,res=true;
function draw2(){
  var burn=!flip&&!res,ok=!flip&&res,h="";$("#pR").textContent=t(res?"resOn":"resOff");
  var topPlus=!flip;
  h+='<path class="wire" d="M70,120V40H180M270,40H470V95M470,160V260H70V140"/>';
  if(res)h+='<path d="M180,40l10,-16l16,32l16,-32l16,32l10,-16" fill="none" stroke="#cfcabf" stroke-width="5" stroke-linejoin="round"/><text x="225" y="84" text-anchor="middle" font-size="15" fill="#9aa4b5">'+t("resistor")+'</text>';
  else h+='<path d="M180,40H270" stroke="#FF6B5E" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>';
  h+='<path d="M70,120V140" stroke="#14181F" stroke-width="12"/>';
  h+='<path d="M'+(topPlus?38:50)+',120H'+(topPlus?102:90)+'" stroke="'+(topPlus?"#FF6B5E":"#4DA3FF")+'" stroke-width="6" stroke-linecap="round"/>';
  h+='<path d="M'+(topPlus?50:38)+',142H'+(topPlus?90:102)+'" stroke="'+(topPlus?"#4DA3FF":"#FF6B5E")+'" stroke-width="6" stroke-linecap="round"/>';
  h+='<text x="116" y="127" font-size="24" font-weight="800" fill="'+(topPlus?"#FF6B5E":"#4DA3FF")+'">'+(topPlus?"+":"−")+'</text><text x="116" y="152" font-size="24" font-weight="800" fill="'+(topPlus?"#4DA3FF":"#FF6B5E")+'">'+(topPlus?"−":"+")+'</text>';
  if(ok)h+='<path class="flow" style="animation-duration:1s" d="M70,120V40H470V95M470,160V260H70V140"/>';
  var col=burn?"#2b2b2b":"#3CFF8A";
  h+='<g transform="translate(0,0)">';
  if(ok)h+='<circle cx="470" cy="128" r="72" fill="#3CFF8A" opacity=".16"/><circle cx="470" cy="128" r="46" fill="#3CFF8A" opacity=".85"/>';
  h+='<path d="M440,95H500L470,155Z" fill="'+(ok?"#bfffd8":"#232A35")+'" stroke="'+(burn?"#555":"#3CFF8A")+'" stroke-width="5" stroke-linejoin="round"/><path d="M438,160H502" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/>';
  if(burn)h+='<text x="470" y="128" text-anchor="middle" font-size="40">💥</text>';
  h+='</g><text x="520" y="102" font-size="15" fill="#9aa4b5">'+t("anode")+'</text><text x="520" y="178" font-size="15" fill="#9aa4b5">'+t("cathode")+'</text><text x="470" y="290" text-anchor="middle" font-size="16" fill="#9aa4b5">LED</text>';
  $("#c2").innerHTML=h;
  var m=$("#say2");
  if(ok){m.className="say good";m.textContent=t("p_ok")}
  else if(burn){m.className="say bad";m.textContent=t("p_burn")}
  else{m.className="say bad";m.textContent=t("p_rev")}
}
$("#pF").onclick=function(){flip=!flip;draw2()};
$("#pR").onclick=function(){res=!res;this.className=res?"on":"";draw2()};
$("#pX").onclick=function(){flip=false;res=true;$("#pR").className="on";draw2()};
draw2();

/* calculator */
function calc(){

  [].forEach.call(document.querySelectorAll("h1,h2"),function(h){
    var n=0,full=[];

        s.style.setProperty("--h",(90+Math.floor(Math.random()*90))+"px");
        par.appendChild(s);

/* buttery mouse-wheel scrolling (desktop mouse only; touch and trackpads stay native) */
(function(){

    while(el&&el!==document.body&&el!==de){

})();
